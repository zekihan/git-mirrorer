name: PR Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint:
    runs-on: zekihan.git-mirrorer
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make
          chmod +x scripts/install_build_deps.sh
          bash scripts/install_build_deps.sh

      - name: Lint Check
        run: |
          make build_deps
          make tidy
          git diff --exit-code

  build_and_test:
    runs-on: zekihan.git-mirrorer
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make
          chmod +x scripts/install_build_deps.sh
          bash scripts/install_build_deps.sh

      - name: Build
        run: |
          make build_deps
          make tidy
          make build
