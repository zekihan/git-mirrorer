name: Docker Build & Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  build_push:
    runs-on: zekihan.git-mirrorer
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: setup_builder
        run: |
          chmod +x .github/scripts/setup_buildx.sh
          bash .github/scripts/setup_buildx.sh
          vers=$(tr -d '[:space:]' <VERSION)
          echo "version=$vers" >> $GITHUB_OUTPUT
        env:
          KUBECONFIG_DATA: ${{ env.KUBE_CONFIG }}

      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}
          logout: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ steps.setup_builder.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.7.0
        with:
          builder: ${{ steps.setup_builder.outputs.name }}
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Buildx Cleanup
        if: always()
        run: |
          chmod +x .github/scripts/setup_buildx_cleanup.sh
          bash .github/scripts/setup_buildx_cleanup.sh
        env:
          UUID: ${{ steps.setup_builder.outputs.UUID }}
