version: 2
project_name: git-mirrorer
builds:
  - id: all
    main: ./cmd/git-mirrorer
    binary: git-mirrorer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.date={{.Date}}
      - -X main.commit={{.Commit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - id: all
    ids: [all]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - git-mirrorer.example.yaml
      - docs/rewrite-plan.md
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  ids: [all]
