version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
